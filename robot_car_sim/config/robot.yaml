# Single source of truth for the numbers the simulation needs. Read by the xacro
# (xacro.load_yaml) and by the launch file for wheel_debug, so the DiffDrive plugin
# and the expected-wheel-speed math always agree.
# Units: meters, radians, Hz.
#
# wheel and lidar.z_offset are measured from the Fusion meshes and written by
#   python3 tools/import_fusion_urdf.py fusion/export/basic_description
wheel:
  radius: 0.05
  separation: 0.225
lidar:
  # Height of the scan plane above the lidar_1 frame (center of the lidar body).
  z_offset: 0.0125
  samples: 360
  range_min: 0.12
  range_max: 8.0
  update_rate: 10
